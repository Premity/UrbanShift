[project]
name = "urbanshift-api"
version = "0.1.0"
description = "UrbanShift FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "sentence-transformers>=2.2.0",
    "litellm>=1.0.0",
    "langgraph>=1.1.0",
    "structlog>=24.0.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
