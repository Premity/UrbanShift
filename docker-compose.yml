# ── UrbanShift — Full Stack Dev Environment ──────────────
# Services: postgres (pgvector) + adminer + api (FastAPI) + web (Vite React)
# Usage: docker compose up --build  |  make dev

services:
  # ── Database ────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanshift}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Database Admin UI ──────────────────────────────────
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI Backend ────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
      - ./scripts:/scripts
      - ./data:/data
    env_file:
      - .env.development
    depends_on:
      db:
        condition: service_healthy

  # ── Vite React Frontend ────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
